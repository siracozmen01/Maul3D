name: pages

# Dispatch-only until Pages is enabled on the repository (Settings,
# Pages, Source: GitHub Actions); a push trigger before that would
# fail the deploy job on every docs commit. Once enabled, add:
#   push: { branches: [main], paths: ["docs/**", "tools/build_docs.py"] }
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown==3.6
      - run: python tools/build_docs.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
