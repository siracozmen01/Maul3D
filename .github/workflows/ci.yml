# The determinism gate: six cells across three OSes, two ISAs, four
# compilers, plus a sanitize+scalar cell. Every cell extracts its
# M3_*_HASH lines; the compare job fails unless every line appears
# identically in every cell. Adapted from Maul2D's proven gate.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-gcc-release,     os: ubuntu-latest,  cc: gcc,   build: Release, flags: "" }
          - { name: ubuntu-clang-release,   os: ubuntu-latest,  cc: clang, build: Release, flags: "" }
          - { name: ubuntu-clang-debug,     os: ubuntu-latest,  cc: clang, build: Debug,   flags: "" }
          - { name: ubuntu-scalar-sanitize, os: ubuntu-latest,  cc: clang, build: Debug,   flags: "-DMAUL3D_SANITIZE=ON -DMAUL3D_SIMD=scalar" }
          - { name: macos-arm64-release,    os: macos-14,       cc: clang, build: Release, flags: "" }
          - { name: windows-msvc-release,   os: windows-latest, cc: cl,    build: Release, flags: "" }
          # The shared-library cell runs the black-box suites and the
          # installed-package consumer; white-box suites need internal
          # symbols a hidden-visibility .so does not export, and its
          # hash lines stay out of the equality accounting (CELLS=6).
          - { name: ubuntu-gcc-shared,      os: ubuntu-latest,  cc: gcc,   build: Release, flags: "-DMAUL3D_BUILD_SHARED=ON" }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.cc }}" = "cl" ]; then
            cmake -S . -B build ${{ matrix.flags }}
          else
            CC=${{ matrix.cc }} cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build }} ${{ matrix.flags }}
          fi
      - name: Build
        shell: bash
        run: cmake --build build --config ${{ matrix.build }} -j
      - name: Test
        shell: bash
        run: |
          cd build
          ctest -C ${{ matrix.build }} -V --output-on-failure | tee out.txt
      - name: Package consumer
        if: matrix.name != 'ubuntu-scalar-sanitize'
        shell: bash
        run: |
          cmake --install build --config ${{ matrix.build }} --prefix "$PWD/pkg"
          if [ "${{ matrix.cc }}" = "cl" ]; then
            cmake -S test/consumer -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/pkg"
          else
            CC=${{ matrix.cc }} cmake -S test/consumer -B build-consumer \
              -DCMAKE_BUILD_TYPE=${{ matrix.build }} -DCMAKE_PREFIX_PATH="$PWD/pkg"
          fi
          cmake --build build-consumer --config ${{ matrix.build }}
          if [ "${{ matrix.cc }}" = "cl" ]; then
            ./build-consumer/${{ matrix.build }}/consumer.exe | tee consumer.txt
          else
            LD_LIBRARY_PATH="$PWD/pkg/lib:$PWD/pkg/lib64" \
              ./build-consumer/consumer | tee consumer.txt
          fi
          grep -q M3_CONSUMER_OK consumer.txt
      - name: Extract hashes
        if: matrix.name != 'ubuntu-gcc-shared'
        shell: bash
        run: |
          grep -oE 'M3_(DET|MATH|WORLD|SOLVER|JOURNAL)_HASH=[0-9a-f]{16}' build/out.txt \
            | sort -u > "hash-${{ matrix.name }}.txt"
          cat "hash-${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@v4
        if: matrix.name != 'ubuntu-gcc-shared'
        with:
          name: hash-${{ matrix.name }}
          path: hash-${{ matrix.name }}.txt

  determinism:
    name: cross-platform hash equality
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: hashes
          merge-multiple: true
      - name: Compare
        shell: bash
        run: |
          CELLS=6
          EXPECTED_LINES=4
          cat hashes/*.txt
          # Every distinct hash line must appear exactly once per cell:
          # a divergent cell or a silently missing line both fail.
          BAD=$(sort hashes/*.txt | uniq -c | awk -v n="$CELLS" '$1 != n' | wc -l)
          DISTINCT=$(sort -u hashes/*.txt | wc -l)
          if [ "$BAD" != "0" ] || [ "$DISTINCT" != "$EXPECTED_LINES" ]; then
            echo "DETERMINISM FAILURE: $DISTINCT distinct lines (want $EXPECTED_LINES), $BAD with wrong cell count"
            exit 1
          fi
          echo "all cells produced identical bits for every gate"

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: |
          pip install clang-format==22.1.5 >/dev/null
          clang-format --version
          # find, not fixed globs: a glob with no match (src/*.h before
          # any internal header exists) turns into a literal path and
          # fails the job for the wrong reason.
          clang-format --dry-run -Werror $(find include src test -name '*.c' -o -name '*.h')
